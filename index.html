<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Jogo multiplayer</title>

        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #EEE;
                text-align: center;
            }

            /* Mesmo cabecalho do Territorio, para as duas paginas serem
               reconheciveis como a mesma aplicacao e nenhuma delas ser um
               beco sem saida. */
            header {
                background: #243544;
                color: #fff;
                padding: 14px 24px;
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
                text-align: left;
                font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            }

            header h1 { font-size: 17px; margin: 0; font-weight: 600; }
            header nav { margin-left: auto; display: flex; gap: 8px; }

            header a {
                color: #fff;
                text-decoration: none;
                font-size: 13px;
                padding: 6px 12px;
                border: 1px solid rgba(255,255,255,.35);
                border-radius: 6px;
            }

            header a:hover { background: rgba(255,255,255,.12); }

            #jogo { margin-top: 40px; }

            #screen {
                border: 1px solid #CCC;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                image-rendering: -moz-crisp-edges;
                width: 400px;
                height: 400px;
                -webkit-box-shadow: 0px 4px 17px 0px rgba(0,0,0,0.19);
                -moz-box-shadow: 0px 4px 17px 0px rgba(0,0,0,0.19);
                box-shadow: 0px 4px 17px 0px rgba(0,0,0,0.19);
                margin-bottom: 20px;
                margin-left: 20px;
                margin-right: 20px;
                display: inline-block;
                vertical-align: top;
            }

            #score-table {
                font-size: 13px;
                vertical-align: top;
                display: inline-block;
                font-family: Arial, Helvetica, sans-serif
            }

            #score-table tr.header td {
                border-bottom: 1px solid #CCC;
                padding-bottom: 8px;
            }

            #score-table tr.footer td {
                border-top: 1px solid #CCC;
                font-size: 11px;
            }

            #score-table td {
                padding-top: 5px;
                padding-bottom: 5px;
            }

            #score-table .socket-id {
                font-weight: normal;
                color: #222;
                width: 220px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: inline-block
            }

            #score-table .score-value {
                font-weight: bold;
                color: #000;
                text-align: right;
            }

            #score-table .current-player .socket-id,
            #score-table .current-player .score-value {
                color: #bdaa27;
            }

        </style>
        <script src="/socket.io/socket.io.js"></script>
    </head>
    <body>
        <header>
            <h1>Jogo multiplayer</h1>
            <nav>
                <a href="/menu">Menu</a>
                <a href="/territorio">Territorio</a>
            </nav>
        </header>

        <div id="jogo">
            <canvas id="screen" width="10" height="10"></canvas>
            <table id="score-table"></table>
        </div>

        <script type="module">
            import createGame from './game.js'
            import createKeyboardListener from './keyboard-listener.js'
            import renderScreen, { setupScreen } from './render-screen.js'
            
            const game = createGame()
            const keyboardListener = createKeyboardListener(document)

            const socket = io()

            socket.on('connect', () => {
                const playerId = socket.id
                // console.log(`Player connected on Client with id: ${playerId}`)
                // console.log('socket', socket)

                const screen = document.getElementById('screen')
                const scoreTable = document.getElementById('score-table')
                
                setupScreen(screen, game)
                renderScreen(screen, scoreTable, game, requestAnimationFrame, playerId)
            })

            socket.on('disconnect', () => {
                console.log('Unsubscribing All')
                keyboardListener.unsubscribeAll();
            })

            socket.on('setup', (state) => {
                const playerId = socket.id
                game.setState(state)

                keyboardListener.registerPlayerId(playerId)
                keyboardListener.subscribe(game.movePlayer)
                keyboardListener.subscribe((command) => {
                    socket.emit('move-player', command)
                })
            })

            socket.on('add-player', (command) => {
                // console.log(`Receiving ${command.type} -> ${command.playerId}`)
                game.addPlayer(command)
            })

            socket.on('remove-player', (command) => {
                // console.log(`Receiving ${command.type} -> ${command.playerId}`)
                game.removePlayer(command)
            })

            socket.on('move-player', (command) => {
                // console.log(`Receiving ${command.type} -> ${command.playerId}`)

                const playerId = socket.id

                if (playerId !== command.playerId) {
                    game.movePlayer(command)
                }
            })

            socket.on('add-fruit', (command) => {
                // console.log(`Receiving ${command.type} -> ${command.fruitId}`)
                game.addFruit(command)
            })

            socket.on('remove-fruit', (command) => {
                // console.log(`Receiving ${command.type} -> ${command.fruitId}`)
                game.removeFruit(command)
            })
        </script>
    </body>
</html>
